name: Catalog drift probe (b50)

# Once a day, compare the DMV's live catalog against what we store, and PROPOSE
# a routing state for every calendar. It never approves anything: the ops
# Calendars page is the only writer of approved_state, so a proposal always
# waits for a person.
#
# Like scan.yml, this repo holds only the workflow. The probe itself lives in
# the private monorepo at apps/scanner/src/drift-probe.ts and is cloned at run
# time with PRIVATE_REPO_TOKEN.
#
# Plan: docs/superpowers/plans/2026-09-06-availability-aware-routing.md, Task 9

on:
  schedule:
    # 15:20 UTC = 05:20 HST, before the county's usual release window, so the
    # owner sees proposals with the morning rather than mid-afternoon.
    - cron: '20 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print proposals without writing or alerting'
        type: boolean
        default: false

concurrency:
  group: drift-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone private scanner repo (read-only token)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/David-Cito/dmv-monitor-v2.git" \
            scanner

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: scanner/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: scanner
        run: pnpm install --frozen-lockfile

      - name: Run the drift probe
        working-directory: scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # No Discord or Pushover secret here on purpose. The probe does not
          # call either service. It writes notification_queue rows and the
          # existing dispatcher drains them to the right channel, which is how
          # every other emitter in this system works. Adding webhook secrets
          # here would create a second notification path.
          #
          # Dead-man's switch. Empty = no pings, and never a failure.
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          # Only used to build the "Open:" link in a nudge.
          OPS_DASHBOARD_URL: ${{ secrets.OPS_DASHBOARD_URL }}
        run: |
          # The probe pings the drift-probe heartbeat itself, at the END of a
          # successful run only, so a failure here correctly goes unpinged and
          # Healthchecks pages on the silence.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run: computing proposals, writing nothing, alerting nobody"
            pnpm exec tsx apps/scanner/src/drift-probe.ts --dry-run
          else
            pnpm exec tsx apps/scanner/src/drift-probe.ts
          fi
