name: Ops probe (off-stack health)

# A machine that is NOT the Supabase instance asks the database ten
# questions every 10 minutes and pages with the answers in the text.
#
# Why this exists: on 2026-09-08 every in-stack alarm (pg_cron -> pg_net ->
# edge functions -> dispatcher) starved together at 10:55 HST, and the only
# thing that reached the operator was the dead-man's switch three hours later,
# saying "a check missed its ping" and nothing else. This probe would have
# fired at 10:56 on the "did the query time out" question alone, and the swap
# question would have fired hours before that.
#
# Like scan.yml and drift-probe.yml, this repo holds only the workflow. The
# probe lives in the private monorepo at apps/scanner/src/ops-probe.mjs and is
# cloned at run time with PRIVATE_REPO_TOKEN. Unlike those, it needs NO pnpm
# install: it is dependency-free by design (a watchdog should depend on as
# little as possible), so the run is a clone and a `node`.
#
# WHY A LOOP, NOT A `*/10` SCHEDULE. GitHub's scheduler on this repo lags by
# hours (2026-09-09: a plain `*/10` workflow did not fire once in two hours),
# which is exactly why scan.yml runs the road-test scanner as a 5-hour loop.
# Same shape here: one job loops for ~5 hours running the probe every 10
# minutes; the concurrency group queues the next scheduled run so it starts
# the moment this one ends. The probe pings its Healthchecks check on every
# good iteration; the check's grace (20 min) absorbs the restart gap.
#
# Reporting is deliberately NOT through notification_queue — the dispatcher is
# one of the things being watched. On a bad verdict the probe posts the Discord
# webhook directly and pings hc-ping.com/<key>/ops-probe/fail, which pages
# Pushover through the existing Healthchecks integrations.
#
# Plan §9 and §2: docs/superpowers/ui/2026-09-08-post-incident-plan/plan.md (monorepo)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'One pass: print the verdict, report nowhere, exit 0'
        type: boolean
        default: false

concurrency:
  group: ops-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Clone private scanner repo (read-only token)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/David-Cito/dmv-monitor-v2.git" \
            scanner

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the probe (one pass, or a 5-hour loop every 10 minutes)
        working-directory: scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPS_DASHBOARD_URL: ${{ secrets.OPS_DASHBOARD_URL }}
          # The public read path (2026-09-13): the probe asks the view for
          # rows with the same key the website uses, so a permissions change
          # or a bad Vercel variable cannot hide behind the marketing pages'
          # week of remembered dates. Absent = the question is skipped.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node apps/scanner/src/ops-probe.mjs --dry-run
            exit $?
          fi
          end_time=$(($(date +%s) + 18000))  # now + 5 hours; the job cap is 330 min
          iteration=0
          bad=0
          while [ $(date +%s) -lt $end_time ]; do
            iteration=$((iteration + 1))
            echo "=== ops-probe iteration $iteration ($(TZ=Pacific/Honolulu date +%H:%M:%S) HST) ==="
            # A bad verdict exits 1 and has already paged; the loop keeps
            # going so the NEXT iteration can report recovery.
            if node apps/scanner/src/ops-probe.mjs; then :; else bad=$((bad + 1)); fi
            [ $((end_time - $(date +%s))) -lt 620 ] && break
            sleep 600
          done
          echo "loop complete after $iteration iterations, $bad bad verdicts"
          # Red run if anything was bad during the loop, so the Actions list shows it.
          [ "$bad" -eq 0 ]
