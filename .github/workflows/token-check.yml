name: Token check (diagnostic)

# Manual-only diagnostic: reports whether PRIVATE_REPO_TOKEN can still read the
# private monorepo and when it expires. Prints response HEADERS only; the
# token value is never echoed (and GitHub masks secrets in logs regardless).
# No pull_request trigger on purpose.

on:
  workflow_dispatch:
    inputs: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe the private repo with PRIVATE_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          case "$TOKEN" in
            github_pat_*) echo "token kind: fine-grained PAT";;
            ghp_*)        echo "token kind: classic PAT";;
            "")           echo "token kind: SECRET IS EMPTY";;
            *)            echo "token kind: other/unknown prefix";;
          esac
          curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/David-Cito/dmv-monitor-v2 \
          | grep -i -E '^(HTTP/|github-authentication-token-expiration|x-oauth-scopes|x-accepted-github-permissions)' \
          || echo "no matching headers (request failed?)"
