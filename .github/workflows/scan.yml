name: Road Test Scanner (bootstrap)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs: {}

concurrency:
  group: rt-scanner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # queue our own successor (workflow_dispatch is allowed from GITHUB_TOKEN)

jobs:
  rt-scan:
    runs-on: ubuntu-latest
    # Long-running loop job: each scan takes ~2-3 min, we loop for ~5 hours
    # to bypass GitHub Actions scheduled-workflow queue delays. Each run queues
    # its own successor as it starts (gh workflow run), so the next loop begins
    # the moment this one ends; the */5 cron is only the restart trigger if
    # that chain breaks (2026-10-05: the cron alone left 3-9 hour gaps). Concurrency group
    # `rt-scanner` ensures only one chain runs at a time. This workflow clones
    # the private dmv-monitor-v2 repo at runtime (read-only token) and runs
    # the dedicated road-test-only entrypoint (apps/scanner/src/rt-scanner.ts).
    timeout-minutes: 330

    steps:
      - name: Clone private scanner repo (read-only token)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/David-Cito/dmv-monitor-v2.git" \
            scanner

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: scanner/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: scanner
        run: pnpm install --frozen-lockfile

      - name: Run Road Test Scanner (continuous HTTP loop)
        working-directory: scanner
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Healthchecks.io project ping key (dead-man's switch). Empty = no pings.
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          WEB_APP_ORIGIN: https://oahustandby.com
        run: |
          # Continuous HTTP scan loop for ~5 hours, exiting cleanly before the
          # job timeout. The */5 cron only restarts the chain after it exits.
          # A full HTTP scan is <~10s, so we run effectively continuously by day
          # (near-real-time: ~30% of RT slots die within a single ~3-min tick).
          # Night mode (1-5am HST): a modest 30s pause between scans so we are
          # not hammering at the deadest hours. Per-scan in-process backoff (in
          # the scanner) handles transient DMV errors; this loop only adds the
          # coarse night throttle and keeps the chain alive on a failed scan.
          # Dead-man's switch (Healthchecks.io). Two checks ride this loop:
          #   rt-runner  pinged after every scanner exit 0 -> "the RT scanner is alive"
          #   web-app    pinged only when oahustandby.com answers 200 AND the SMS
          #              dispatch route answers 401 (auth-gated but alive). The
          #              customer SMS dispatcher POSTs to that route, so a Vercel
          #              outage silently kills customer texts. Free synthetic
          #              check from OUTSIDE the stack, no third vendor.
          # A ping must never break the loop: -f/-m/|| true everywhere.
          hc_ping() {  # $1 = slug
            [ -n "$HEALTHCHECKS_PING_KEY" ] || return 0
            curl -fsS -m 5 --retry 2 -o /dev/null "https://hc-ping.com/${HEALTHCHECKS_PING_KEY}/$1" \
              || echo "heartbeat $1: ping failed (ignored)"
          }
          web_app_alive() {
            curl -fsS -m 10 -o /dev/null "$WEB_APP_ORIGIN/" || return 1
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' -X POST "$WEB_APP_ORIGIN/api/internal/dispatch-sms" || echo 000)
            [ "$code" = "401" ]
          }
          end_time=$(($(date +%s) + 18000))  # now + 5 hours
          # Queue our successor now: the concurrency group holds it pending
          # until this run ends. A scheduled run arriving later replaces it,
          # so there is still exactly one pending.
          gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            || echo "::warning::could not queue the next run; relying on the schedule"
          iteration=0
          while [ $(date +%s) -lt $end_time ]; do
            iteration=$((iteration + 1))
            echo "=== rt-scan iteration $iteration ($(TZ=Pacific/Honolulu date +%H:%M:%S) HST) ==="
            # Hard per-scan ceiling: even with the scanner's own fetch timeouts,
            # a wedged process must never freeze this 5-hour loop (2026-09-27: a
            # hung scan blocked the chain for hours and silenced both dead-man
            # checks). timeout returns 124 on a hang -> treated as a failed
            # iteration -> loop continues and re-pings on the next good scan.
            if timeout -k 15 300 pnpm exec tsx apps/scanner/src/rt-scanner.ts; then
              hc_ping rt-runner
              if web_app_alive; then hc_ping web-app; else echo "web-app check failed (no ping)"; fi
            else
              echo "iteration $iteration failed (continuing)"
            fi
            # Night-mode throttle: only sleep during 1-5am Hawaii time.
            hst_hour=$(TZ=Pacific/Honolulu date +%H)
            if [ "$hst_hour" -ge 1 ] && [ "$hst_hour" -lt 5 ]; then
              echo "night mode (HST ${hst_hour}h): 30s pause"
              sleep 30
            fi
            # Bail if we're about to exceed the budget on the next iteration.
            [ $((end_time - $(date +%s))) -lt 15 ] && break
          done
          echo "loop complete after $iteration iterations"

# gate: relay-scanner Option 2 bootstrap
